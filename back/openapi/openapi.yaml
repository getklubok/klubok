openapi: 3.0.2

servers:
  - url: /

info:
  title: Klubok API
  version: 0.1.0
  license:
    name: AGPLv3
    url: https://www.gnu.org/licenses/agpl-3.0.html

tags:
  - name: RootService
    description: Root service
  - name: DiagramService
    description: Diagram service
  - name: UserService
    description: User service

security:
  - sessionCookie: []

paths:
  /:
    x-ogen-operation-group: Index
    get:
      security: []
      summary: Get index.
      operationId: Index
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexResponse"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
      tags:
        - RootService

  /health/live:
    x-ogen-operation-group: Health
    get:
      security: []
      summary: Check liveness.
      operationId: HealthLive
      responses:
        "204":
          description: The process is alive.
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - RootService

  /health/ready:
    x-ogen-operation-group: Health
    get:
      security: []
      summary: Check readiness.
      operationId: HealthReady
      responses:
        "204":
          description: The service is ready to accept traffic.
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
        "503":
          description: A critical dependency is unavailable.
      tags:
        - RootService

  /features:
    x-ogen-operation-group: Features
    get:
      security: []
      summary: Get feature flags.
      operationId: Features
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesResponse"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - RootService

  /diagrams:
    x-ogen-operation-group: Diagram
    get:
      summary: List diagrams.
      operationId: DiagramList
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramListResponse"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
    post:
      summary: Create diagram.
      operationId: DiagramCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramCreateRequest"
      responses:
        "201":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "400":
          $ref: "#/components/responses/StatusBadRequest"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
  /diagrams/import:
    x-ogen-operation-group: Diagram
    post:
      summary: Import a diagram.
      operationId: DiagramImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramImportRequest"
      responses:
        "201":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "400":
          $ref: "#/components/responses/StatusBadRequest"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
  /diagrams/{diagramId}/title:
    x-ogen-operation-group: Diagram
    patch:
      summary: Set title diagram.
      operationId: DiagramSetTitle
      parameters:
        - name: diagramId
          $ref: "#/components/parameters/DiagramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramSetTitleRequest"
      responses:
        "204":
          description: A successful response.
        "400":
          $ref: "#/components/responses/StatusBadRequest"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "403":
          $ref: "#/components/responses/StatusForbidden"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
  /diagrams/{diagramId}:
    x-ogen-operation-group: Diagram
    get:
      summary: Info diagram.
      operationId: DiagramInfo
      parameters:
        - name: diagramId
          $ref: "#/components/parameters/DiagramId"
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramInfoResponse"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "403":
          $ref: "#/components/responses/StatusForbidden"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
    delete:
      summary: Delete diagram.
      operationId: DiagramDelete
      parameters:
        - name: diagramId
          $ref: "#/components/parameters/DiagramId"
      responses:
        "204":
          description: A successful response.
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "403":
          $ref: "#/components/responses/StatusForbidden"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
  /diagrams/{diagramId}/stat:
    x-ogen-operation-group: Diagram
    get:
      summary: Stat diagram.
      operationId: DiagramStat
      parameters:
        - name: diagramId
          $ref: "#/components/parameters/DiagramId"
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramStatResponse"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "403":
          $ref: "#/components/responses/StatusForbidden"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
  /diagrams/{diagramId}/onlineUsers:
    x-ogen-operation-group: Diagram
    get:
      summary: Online users on diagram.
      operationId: DiagramOnlineUsers
      parameters:
        - name: diagramId
          $ref: "#/components/parameters/DiagramId"
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramOnlineUsersResponse"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "403":
          $ref: "#/components/responses/StatusForbidden"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
      tags:
        - DiagramService
  /diagrams/{diagramId}/clone:
    x-ogen-operation-group: Diagram
    post:
      summary: Clone a diagram with all its contents.
      operationId: DiagramClone
      parameters:
        - name: diagramId
          $ref: "#/components/parameters/DiagramId"
      responses:
        "201":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "401":
          $ref: "#/components/responses/StatusUnauthorized"
        "403":
          $ref: "#/components/responses/StatusForbidden"
        "404":
          $ref: "#/components/responses/StatusNotFound"
        "429":
          $ref: "#/components/responses/StatusTooManyRequests"
        "500":
          $ref: "#/components/responses/StatusInternalServerError"
