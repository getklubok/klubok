version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/sql"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        initialisms: ["id"]
        query_parameter_limit: 2
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "bigint"
            go_type: "int32"
          - column: "diagram_shapes.data"
            go_type:
              type: "DiagramShape"
              import: "klubok/internal/domain"
          - column: "diagram_collaborators.permission"
            go_type:
              type: "DiagramCollaboratorPermission"
              import: "klubok/internal/domain"
