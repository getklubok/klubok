# =============================================================================
# Маскирование IP-адресов в логах nginx.
#
# Раскомментируйте блок ниже ВМЕСТЕ с включением флага back
# FEATURE_IP_MASKING_ENABLED=true (nginx не читает env back — согласованность
# обеспечивается процедурой развёртывания), затем примените конфиг:
#   nginx -t && nginx -s reload
#
# И в server-блоках ниже раскомментируйте строку access_log с
# $remote_addr_masked вместо дефолтной ( access_log /var/log/nginx/access.log ).
# =============================================================================

# map $remote_addr $remote_addr_masked {
#     ~^(\d+)\.(\d+)\.(\d+)\.\d+$  $1.$2.$3.x;
#     default                      $remote_addr;
# }
#
# log_format masked '$remote_addr - $remote_user [$time_local] '
#                   '"$request" $status $body_bytes_sent '
#                   '"$http_referer" "$http_user_agent" '
#                   'rt=$request_time uct="$upstream_connect_time"';
#
# В server блок (443) добавьте:
# access_log /var/log/nginx/access.log masked;

# Путь-зависимые заголовки (CSP, X-Frame-Options, антикэш, MIME политики)
# задаёт приложение — см. back/internal/application/mux.go. В location'ах
# остались только проксирование и Upgrade-заголовки, поэтому add_header
# из server наследуется, а не дублируется.

server {
    listen 80;
    listen [::]:80;
    server_name domain.tld;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domain.tld;

    server_tokens off;
    ignore_invalid_headers on;

    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.tld/privkey.pem;

    ssl_session_cache   shared:SSL:10m; # примерно 40000 сессий
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_types      text/plain text/css text/javascript application/javascript application/json;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied    any;
    gzip_vary       on;

    # Disallow all dot files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:50103; # blue
        #proxy_pass http://127.0.0.1:50113; # green
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }

    location / {
        # Пробы куба не засоряют access.log.
        if ($uri ~ ^/api/health/(live|ready)$) {
            access_log off;
        }

        proxy_pass http://127.0.0.1:50101; # blue
        #proxy_pass http://127.0.0.1:50111; # green

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
